name: Renumber and rebuild count.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install Pillow
      - run: python .github/scripts/renumber.py
      - name: Commit
        run: |
          git config user.name "picbed-crawler"
          git config user.email "actions@github.com"
          git add ri
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "renumber images and rebuild count.json"
            git push
          fi
